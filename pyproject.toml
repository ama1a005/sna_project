[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echochamber"
version = "0.1.0"
description = "Temporal Echo Chamber Detection in Online Social Networks"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=12.0",
    "networkx>=3.1",
    "scikit-learn>=1.3",
    "streamlit>=1.28",
    "plotly>=5.17",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff>=0.1",
    "mypy>=1.5",
    "pandas-stubs",
    "types-PyYAML",
    "types-requests",
    "types-tqdm",
]

[project.scripts]
echochamber = "echochamber.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
